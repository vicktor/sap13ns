{{/* blocks/image: an image from the media library. Data: *BlockView. */}}
{{define "blocks/image"}}{{with .Image}}
<figure class="sap-b sap-b-image sap-img-{{$.S.size}} sap-align-{{$.S.align}}">{{if $.Editing}}<div class="sap-ed-media"{{$.Ed "image"}}>{{end}}
  {{if $.S.link}}<a href="{{$.S.link}}">{{end}}{{template "shared/image" (dict "Image" . "Sizes" "(min-width: 1024px) 60vw, 100vw")}}{{if $.S.link}}</a>{{end}}{{if $.Editing}}</div>{{end}}
  {{with $.S.caption}}<figcaption{{$.Ed "caption"}}>{{.}}</figcaption>{{end}}
</figure>
{{else}}{{if .Editing}}
{{/* In the design preview, an image block without its image is a place to click to choose one. */}}
<figure class="sap-b sap-b-image sap-ed-placeholder"{{.Ed "image"}}>{{icon "image"}}<span>{{T "Click to choose an image"}}</span></figure>
{{end}}{{end}}{{end}}
