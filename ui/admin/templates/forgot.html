{{template "auth" .}}
{{define "content"}}
<header><h1>{{T "Reset your password"}}</h1><p>{{T "We will send you a link to choose a new one."}}</p></header>
<section>
  {{template "form-alerts" .D}}
  {{if not .D.Notice}}
  <form method="post" action="{{.Auth.Forgot}}" class="form auth-form">
    <div class="field">
      <label for="email">{{T "E-mail"}}</label>
      <input class="input" id="email" name="email" type="email" autocomplete="email" required maxlength="254" autofocus>
    </div>
    <button class="btn w-full" type="submit">{{icon "send"}}{{T "Send link"}}</button>
  </form>
  {{end}}
</section>
<footer><p><a href="{{.Auth.Login}}">{{icon "arrow-left" "size-3.5"}} {{T "Back to log in"}}</a></p></footer>
{{end}}
