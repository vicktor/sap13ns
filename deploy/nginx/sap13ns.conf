# nginx in front of sap13ns, which listens on a Unix socket.
#
#   install -m 0644 sap13ns.conf /etc/nginx/sites-available/sap13ns.conf
#   ln -s ../sites-available/sap13ns.conf /etc/nginx/sites-enabled/
#   usermod -aG sap13ns www-data        # nginx must reach the 0660 socket
#   nginx -t && systemctl reload nginx
#
# Replace example.com, then get a certificate, for example with
# `certbot certonly --webroot -w /var/www/letsencrypt -d example.com`.
# With nginx serving /uploads/ (below), set SAP13NS_SERVE_UPLOADS=false.

upstream sap13ns {
    server unix:/run/sap13ns/sap13ns.sock;
    keepalive 32;
}

# Uploaded files of other types are downloaded, never rendered.
map $uri $sap13ns_upload_disposition {
    default                                                      "attachment";
    ~*\.(jpe?g|png|gif|webp|avif|mp3|ogg|wav|mp4|webm|pdf)$      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # sap13ns sends HSTS, CSP and the other security headers itself.
    server_tokens off;

    # Uploads are checked by the application; the WordPress importer and
    # plugin packages have their own, larger limits below.
    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml application/atom+xml application/feed+json
               image/svg+xml text/plain text/markdown;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # nginx is the edge: replace, never append to, what the client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://sap13ns;
    }

    # Uploaded media straight from disk, sandboxed like the application does.
    location /uploads/ {
        alias /var/lib/sap13ns/uploads/;
        expires 30d;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition $sap13ns_upload_disposition always;
        location ~ /\. { return 404; }
    }

    # The AI assistant may wait several minutes for a local model, and the
    # site assistant streams its answers (it sends X-Accel-Buffering: no).
    location /admin/api/ai/ {
        proxy_pass http://sap13ns;
        proxy_read_timeout 360s;
    }
    location /api/assistant {
        proxy_pass http://sap13ns;
        proxy_read_timeout 360s;
    }

    # WordPress export files (up to 256 MiB) and plugin packages.
    location = /admin/tools/import {
        proxy_pass http://sap13ns;
        client_max_body_size 260m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location = /admin/plugins/upload {
        proxy_pass http://sap13ns;
        client_max_body_size 48m;
    }
}
