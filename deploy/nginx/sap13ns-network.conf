# nginx in front of a network of sap13ns sites (SAP13NS_MULTISITE=true):
# the portal on example.com and every site on <slug>.example.com, with one
# wildcard certificate (a DNS-01 challenge, for example certbot with the
# plugin of your DNS provider). deploy/setup.sh writes it; by hand:
#
#   sed 's/example\.com/YOUR.DOMAIN/g' sap13ns-network.conf > /etc/nginx/sites-available/sap13ns.conf
#   ln -s ../sites-available/sap13ns.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The upstream, the proxy headers and the locations are those of
# sap13ns.conf. No block is a default_server and each answers only its own
# names, so other sites on the same nginx keep working as they are.

upstream sap13ns {
    server unix:/run/sap13ns/sap13ns.sock;
    keepalive 32;
}

# Port 80: https, and the ACME HTTP-01 challenges of the customers' own
# domains (add each one to server_name).
server {
    listen 80;
    listen [::]:80;
    server_name example.com *.example.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# www.example.com goes to the portal.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

# The portal and every site of the network.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com *.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sap13ns_SSL:10m;
    ssl_session_timeout 1d;

    # sap13ns sends HSTS, CSP and the other security headers itself.
    server_tokens off;

    # Uploads are checked by the application; the WordPress importer and
    # plugin packages have their own, larger limits below.
    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/xml
               application/rss+xml application/atom+xml application/feed+json
               image/svg+xml text/plain text/markdown;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # sap13ns routes on the Host header: pass it unchanged.
    proxy_set_header Host $host;
    # nginx is the edge: replace, never append to, what the client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://sap13ns;
    }

    # The AI assistant may wait several minutes for a local model, and the
    # site assistant streams its answers (it sends X-Accel-Buffering: no).
    location /admin/api/ai/ {
        proxy_pass http://sap13ns;
        proxy_read_timeout 360s;
    }
    location /api/assistant {
        proxy_pass http://sap13ns;
        proxy_read_timeout 360s;
    }

    # WordPress export files (up to 256 MiB) and plugin packages.
    location = /admin/tools/import {
        proxy_pass http://sap13ns;
        client_max_body_size 260m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location = /admin/plugins/upload {
        proxy_pass http://sap13ns;
        client_max_body_size 48m;
    }

    # Content exports stream while they are written (the response sends
    # X-Accel-Buffering: no), and a prepared .zip can take a while to send.
    location ^~ /admin/tools/export {
        proxy_pass http://sap13ns;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
